name: Release

# Publishes the extension when a version tag (e.g. v0.1.0) is pushed.
# Requires repository secrets:
#   VSCE_PAT  - VS Code Marketplace personal access token
#   OVSX_PAT  - Open VSX token (optional)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.0.1)'
        required: true
        default: 'v0.0.1'

jobs:
  publish:
    runs-on: ubuntu-latest
    # Allow the default GITHUB_TOKEN to create the GitHub release and upload assets.
    permissions:
      contents: write
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      - name: Publish to VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: npx vsce publish --packagePath *.vsix
      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: npx ovsx publish *.vsix -p "$OVSX_PAT"
      - name: Extract release notes from CHANGELOG
        # Release notes are the CHANGELOG section for this version, so commit
        # trailers (e.g. Co-Authored-By) never leak into the release body.
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag = 1; next }
            /^## \[/ { if (flag) exit }
            flag { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Step Function Viewer Light $TAG" > RELEASE_NOTES.md
          fi
          cat RELEASE_NOTES.md
      - name: Create the GitHub release and attach the VSIX
        uses: softprops/action-gh-release@v2
        with:
          # On a tag push, use the pushed tag; on manual dispatch, use the input
          # (the action creates the tag at the dispatched commit).
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: '*.vsix'
